    <script>
        // Fallback: ถ้า CDN หลักโหลดไม่สำเร็จ ลอง CDN สำรอง
        (function ensureXLSX() {
            const fallbacks = [
                "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
                "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
                "https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"
            ];
            let i = 0;
            function tryNext() {
                if (typeof XLSX !== "undefined") return;
                if (i >= fallbacks.length) return;
                const s = document.createElement("script");
                s.src = fallbacks[i++];
                s.onload = () => console.log("XLSX loaded from fallback");
                s.onerror = tryNext;
                document.head.appendChild(s);
            }
            // เช็คหลังหน้าโหลดเสร็จ
            window.addEventListener("load", () => {
                if (typeof XLSX === "undefined") tryNext();
            });
        })();
        
        // โหลด XLSX แบบรอได้ (ใช้ตอนกด export ถ้ายังไม่มี)
        function loadXLSXNow() {
            return new Promise((resolve, reject) => {
                if (typeof XLSX !== "undefined") return resolve();
                const urls = [
                    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
                    "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
                    "https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js",
                    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"
                ];
                let i = 0;
                function next() {
                    if (typeof XLSX !== "undefined") return resolve();
                    if (i >= urls.length) return reject(new Error("โหลด Excel library ไม่สำเร็จ - เช็คอินเทอร์เน็ตแล้วลองใหม่"));
                    const s = document.createElement("script");
                    s.src = urls[i++];
                    s.onload = () => resolve();
                    s.onerror = next;
                    document.head.appendChild(s);
                }
                next();
            });
        }
    </script>

        // คัดหมวดหมู่ที่ใกล้เคียงจาก 2,062 หมวด (คัดในเครื่องก่อนส่งให้ AI เลือก)
        function findCategoryCandidates(item) {
            const seeds = {
                clothing: ['เสื้อ', 'กางเกง', 'แจ็คเก็ต', 'เสื้อผ้า', 'ชุด', 'กระโปรง', 'ฮู้ด', 'สูท', 'โค้ท', 'ยีนส์'],
                bags: ['กระเป๋า', 'เป้', 'สะพาย', 'คลัทช์'],
                shoes: ['รองเท้า', 'สนีกเกอร์', 'บูท', 'แตะ'],
                accessories: ['นาฬิกา', 'แว่น', 'หมวก', 'เข็มขัด', 'สร้อย', 'แหวน', 'กำไล', 'ต่างหู', 'ผ้าพันคอ']
            };
            const text = ((item.name || '') + ' ' + (item.category || ''));
            const words = text.split(/[\s,\/\-\(\)]+/).filter(w => w.length >= 2);
            const kws = [...new Set([...words, ...(seeds[item.productType] || [])])];
            
            const scored = [];
            for (const c of SHOPEE_CATEGORIES) {
                const nm = c[1];
                let score = 0;
                for (const k of kws) {
                    if (nm.includes(k)) score += k.length;
                }
                if (score > 0) scored.push([score, c]);
            }
            scored.sort((a, b) => b[0] - a[0]);
            return scored.slice(0, 60).map(x => x[1]);
        }

        // ===== Gemini AI =====
        async function callGemini(apiKey, model, promptText, base64Image, mimeType) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: mimeType, data: base64Image } }
                        ]
                    }],
                    generationConfig: { maxOutputTokens: 4096, temperature: 1 }
                })
            });
            const data = await response.json();
            if (!response.ok) {
                const err = new Error(data.error?.message || "API Error");
                err.status = response.status;
                throw err;
            }
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        async function generateCaption(idx) {
            const item = itemsData[idx];
            const btn = document.getElementById(`genBtn-${idx}`);
            const statusEl = document.getElementById(`aiStatus-${idx}`);
            
            const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg; };
            
            if (!item.image) {
                alert("⚠️ กรุณา Upload รูปภาพก่อน");
                return;
            }

            const apiKey = getApiKey();
            if (!apiKey) {
                alert("🔑 ยังไม่มี API Key\n\nกรุณาวาง Key ในช่องด้านบนสุด แล้วกด '💾 บันทึก Key' ก่อน (กรอกครั้งเดียว)");
                document.getElementById("apiKeyInput").focus();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            if (btn) { btn.disabled = true; btn.textContent = "⏳ กำลังสร้าง..."; }
            setStatus("📷 กำลังอ่านรูป...");

            try {
                const mimeType = item.image.type || "image/jpeg";
                const base64Image = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const result = reader.result || "";
                        const parts = result.split(',');
                        if (parts.length > 1) resolve(parts[1]);
                        else reject(new Error("อ่านรูปไม่ได้ - ลองเลือกรูปใหม่"));
                    };
                    reader.onerror = () => reject(new Error("อ่านรูปไม่ได้ - ลองเลือกรูปใหม่"));
                    reader.readAsDataURL(item.image);
                });

                const promptText = getAIPrompt(item);

                // ลอง model ที่เคยใช้ได้ก่อน ถ้าไม่มีค่อยไล่ลองทีละตัว
                let savedModel = "";
                try { savedModel = localStorage.getItem(MODEL_STORAGE) || ""; } catch (e) {}
                
                const modelsToTry = savedModel
                    ? [savedModel, ...GEMINI_MODELS.filter(m => m !== savedModel)]
                    : GEMINI_MODELS;

                let caption = "";
                let lastError = null;
                
                const MAX_ROUNDS = 3;
                for (let round = 1; round <= MAX_ROUNDS && !caption; round++) {
                    let overloaded = false;
                    for (let i = 0; i < modelsToTry.length; i++) {
                        const model = modelsToTry[i];
                        setStatus(`🤖 กำลังลอง model ${i + 1}/${modelsToTry.length}: ${model}... (รอบ ${round}/${MAX_ROUNDS})`);
                        try {
                            caption = await callGemini(apiKey, model, promptText, base64Image, mimeType);
                            if (caption) {
                                try { localStorage.setItem(MODEL_STORAGE, model); } catch (e) {}
                                break;
                            }
                        } catch (err) {
                            lastError = err;
                            console.error(`Model ${model} failed:`, err.status, err.message);
                            // 404 = model ไม่มี, 429 = โควต้าหมด, 500/503 = Google ผู้ใช้เยอะ → ลองตัวถัดไป
                            if (err.status === 429) {
                                try { localStorage.removeItem(MODEL_STORAGE); } catch (e) {}
                            }
                            if (err.status === 500 || err.status === 503) overloaded = true;
                            if (![404, 429, 500, 503].includes(err.status)) throw err;
                        }
                    }
                    if (!caption && overloaded && round < MAX_ROUNDS) {
                        setStatus("⏳ Google ผู้ใช้เยอะ รอ 5 วินาทีแล้วลองใหม่...");
                        await new Promise(r => setTimeout(r, 5000));
                    } else if (!caption) {
                        break;
                    }
                }

                if (!caption) {
                    throw lastError || new Error("ไม่พบ model ที่ใช้ได้ - ลองสร้าง API Key ใหม่");
                }
                
                // แยก Caption กับรหัสหมวดหมู่
                let finalCaption = caption;
                let catId = "";
                let title = "";
                const catMatch = caption.match(/===CATEGORY===\s*(\d{5,8})/);
                if (catMatch) {
                    catId = catMatch[1];
                    finalCaption = caption.split('===CATEGORY===')[0];
                } else {
                    // เผื่อ AI ตอบรหัสท้ายข้อความโดยไม่มี marker
                    const looseMatch = caption.match(/(\d{6})\s*$/);
                    if (looseMatch) catId = looseMatch[1];
                }
                const titleMatch = finalCaption.match(/===TITLE===\s*([^\n]+)/);
                if (titleMatch) {
                    title = titleMatch[1].trim().slice(0, 120);
                    finalCaption = finalCaption.replace(/===TITLE===\s*[^\n]+/, '');
                }
                finalCaption = finalCaption.replace(/===CAPTION===/g, '').trim();

                if (title) {
                    item.name = title;
                    const nameInput = document.getElementById(`name-${idx}`);
                    if (nameInput) nameInput.value = title;
                    updateNameCount(idx);
                }
                item.description = finalCaption;
                const textarea = document.getElementById(`desc-${idx}`);
                if (textarea) textarea.value = finalCaption;
                
                // ใส่รหัสหมวดหมู่อัตโนมัติ
                if (catId) {
                    applyCategory(idx, catId);
                    setStatus("✅ Caption + หมวดหมู่ " + catId + " สำเร็จ!");
                } else {
                    setStatus("✅ Caption สำเร็จ (AI ไม่ได้เลือกหมวด - กรอกเองได้)");
                }
                
                if (btn) {
                    btn.textContent = "✅ สำเร็จ";
                    setTimeout(() => { btn.disabled = false; btn.textContent = "🤖 Gemini Caption"; }, 2000);
                }
            } catch (error) {
                console.error("generateCaption error:", error);
                let msg = error.message || "Error";
                if (error.status === 400 && msg.toLowerCase().includes("api key")) {
                    msg = "API Key ไม่ถูกต้อง - กรุณาตรวจสอบและบันทึกใหม่";
                } else if (error.status === 429) {
                    msg = "โควต้าฟรีหมดชั่วคราว ⏳\n\nวิธีแก้:\n1. รอ 1-2 นาที แล้วลองใหม่ (โควต้ารีเซ็ตต่อนาที)\n2. ถ้ายังไม่ได้ รอถึงพรุ่งนี้ (โควต้ารายวันรีเซ็ต)\n3. หรือสร้าง API Key ใหม่ใน Project ใหม่ที่ aistudio.google.com";
                }
                setStatus("❌ " + (error.message || "Error"));
                alert("❌ " + msg);
                if (btn) { btn.disabled = false; btn.textContent = "🤖 Gemini Caption"; }
            }
        }

        async function exportToExcel() {
            const validItems = itemsData.filter(item => item.name && item.price);
            if (validItems.length === 0) {
                alert("⚠️ กรุณากรอกข้อมูลสินค้าอย่างน้อย 1 ชิ้น (ชื่อ + ราคา)");

                const badNames = validItems.filter(it => it.name.length < 20 || it.name.length > 120);
                if (badNames.length > 0) {
                    alert("❌ ชื่อสินค้าไม่ผ่านเกณฑ์ Shopee (ต้อง 20-120 ตัวอักษร):\n\n" + 
                        badNames.map(it => `• "${it.name}" (${it.name.length} ตัว)`).join('\n') + 
                        "\n\nกรุณาแก้ชื่อให้ยาวขึ้น เช่น เพิ่มคำอธิบาย สไตล์ รุ่น สี");
                    return;
                }
                
                // เช็ครหัสหมวดหมู่
                const noCat = validItems.filter(it => !it.categoryId);
                if (noCat.length > 0) {
                    if (!confirm("⚠️ สินค้าบางชิ้นยังไม่มีรหัสหมวดหมู่:\n\n" + 
                        noCat.map(it => `• ${it.name}`).join('\n') + 
                        "\n\n(กด Gemini Caption เพื่อให้ AI หาหมวดให้ หรือกรอกเอง)\n\nจะดาวน์โหลดต่อโดยไม่มีหมวดหมู่ไหม? (Shopee อาจไม่รับ)")) {
                        return;
                    }
                }
                
                // ถ้า XLSX ยังไม่โหลด → โหลดเดี๋ยวนี้
                if (typeof XLSX === "undefined") {
                    await loadXLSXNow();
                }
                
                // อ่าน Shopee template ที่ฝังไว้
                const wb = XLSX.read(SHOPEE_TEMPLATE_B64, { type: 'base64' });
                const sheetName = "แบบฟอร์มการลงสินค้า";
                const ws = wb.Sheets[sheetName];
                if (!ws) throw new Error("ไม่พบ sheet แบบฟอร์มการลงสินค้า");

                const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
                let rowNum = 7; // ข้อมูลเริ่มแถว 7 (แถว 1-6 เป็น header ของ Shopee)
                
                const setCell = (col, row, value, isNum) => {
                    if (value === "" || value === null || value === undefined) return;
                    ws[col + row] = isNum ? { t: 'n', v: Number(value) } : { t: 's', v: String(value) };
                };

                validItems.forEach((item, pIdx) => {
                    const sellPrice = Math.round((parseFloat(item.price) || 0) * 2.3);
                    const parentSku = `P${today}-${pIdx + 1}`;
                    const caption = item.description || item.name;
                    const sizes = item.variants.length > 0 ? item.variants : [null];
                    
                    sizes.forEach((size, sIdx) => {
                        // A: รหัสหมวดหมู่ (AI เลือกให้)
                        if (item.categoryId) setCell('A', rowNum, item.categoryId, true);
                        // B: ชื่อสินค้า (จำเป็น)
                        setCell('B', rowNum, item.name);
                        // C: รายละเอียดสินค้า (จำเป็น 60-5000 ตัวอักษร)
                        setCell('C', rowNum, caption);
                        // I: Parent SKU
                        setCell('I', rowNum, parentSku);
                        
                        if (size) {
                            // J: เลขอ้างอิงตัวเลือกสินค้า (สินค้าเดียวกันใช้เลขเดียวกัน)
                            setCell('J', rowNum, String(100 + pIdx));
                            // K: ชื่อตัวเลือก 1
                            setCell('K', rowNum, 'ไซส์');
                            // L: ตัวเลือก 1
                            setCell('L', rowNum, size);
                        }
                        
                        // P: ราคา (จำเป็น)
                        setCell('P', rowNum, sellPrice, true);
                        // Q: คลังสินค้า (จำเป็น)
                        setCell('Q', rowNum, 10, true);
                        // R: เลข SKU
                        setCell('R', rowNum, `${parentSku}-${sIdx + 1}`);
                        // AE: น้ำหนัก (จำเป็น)
                        setCell('AE', rowNum, 0.5, true);
                        // AI/AJ/AK: ช่องทางจัดส่ง (ต้องเปิดอย่างน้อย 1)
                        setCell('AI', rowNum, 'เปิด');
                        setCell('AJ', rowNum, 'เปิด');
                        setCell('AK', rowNum, 'เปิด');
                        
                        rowNum++;
                    });
                });

                // อัพเดทขอบเขตของ sheet
                ws['!ref'] = `A1:AM${rowNum - 1}`;

                const dateStr = new Date().toISOString().split('T')[0];
                XLSX.writeFile(wb, `Shopee_mass_upload_${dateStr}.xlsx`);
                
                alert(`✅ สร้างไฟล์ Mass Upload สำเร็จ!\n\n📋 ${validItems.length} สินค้า = ${rowNum - 7} แถว (1 ไซส์ = 1 แถว)\n✅ รหัสหมวดหมู่ใส่ให้แล้ว (คอลัมน์ A)\n\n⚠️ ก่อน Upload อย่าลืม: ใส่ลิงก์ "ภาพปก" (คอลัมน์ V) ในไฟล์\n\nแล้ว Upload ที่ Seller Centre → เพิ่มสินค้าแบบชุด`);
            } catch (err) {
                console.error(err);
                alert("❌ สร้างไฟล์ไม่สำเร็จ: " + err.message);
            }
        }

        function renderItems() {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = itemsData.map((item, idx) => `
                <div class="card item-${idx + 1}">
                    <div class="card-title">สินค้า ${idx + 1}</div>
                    
                    <div class="form-group">
                        <label>ประเภทสินค้า</label>
                        <select onchange="itemsData[${idx}].productType = this.value; renderItems()">
                            ${Object.entries(PRODUCT_TYPES).map(([key, val]) => 
                                `<option value="${key}" ${item.productType === key ? 'selected' : ''}>${val.name}</option>`
                            ).join('')}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>ชื่อสินค้า (Shopee บังคับ 20-120 ตัวอักษร)</label>
                        <input type="text" id="name-${idx}" value="${item.name}" oninput="itemsData[${idx}].name = this.value; updateNameCount(${idx})" placeholder="เช่น เสื้อแจ็คเก็ต SUKAJAN ลายปักญี่ปุ่น สตรีทแวร์">
                        <div id="nameCount-${idx}" style="font-size:11px; margin-top:4px; color:#999;"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>🎯 รหัสหมวดหมู่ Shopee (AI ใส่ให้อัตโนมัติ)</label>
                        <input type="text" id="catId-${idx}" value="${item.categoryId || ''}" oninput="itemsData[${idx}].categoryId = this.value" placeholder="AI จะหาให้ตอนกด Gemini Caption">
                        <div id="catName-${idx}" style="font-size:11px; color:#10b981; margin-top:4px; line-height:1.5;">${item.categoryName || ''}</div>
                    </div>
                    
                    <div class="row-2">
                        <div class="form-group">
                            <label>หมวดหมู่</label>
                            <input type="text" value="${item.category}" oninput="itemsData[${idx}].category = this.value" placeholder="เช่น เสื้อผ้า">
                        </div>
                        <div class="form-group">
                            <label>ราคา (บาท)</label>
                            <input type="number" value="${item.price}" oninput="itemsData[${idx}].price = this.value; updateSellPrice(${idx})" placeholder="8900">
                        </div>
                    </div>
                    
                    <div class="row-2">
                        <div class="form-group">
                            <label>ตั้งขาย +130%</label>
                            <input type="text" id="sellPrice-${idx}" readonly style="background: #f5f5f5; color: #d4af37; font-weight: bold;">
                        </div>
                        <div class="form-group">
                            <label>ราคาเต็ม</label>
                            <input type="number" value="${item.originalPrice}" oninput="itemsData[${idx}].originalPrice = this.value" placeholder="12000">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>เลือกไซส์</label>
                        <div class="sizes">
                            ${SIZES.map(size => `<button type="button" class="size-btn ${item.variants.includes(size) ? 'selected' : ''}" onclick="toggleSize(${idx}, '${size}')">${size}</button>`).join('')}
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Upload รูป (สำหรับ Gemini AI)</label>
                        <input type="file" accept="image/*" onchange="handleImageUpload(${idx}, event)">
                        <img id="imagePreview-${idx}" src="" style="display:none; max-width:100%; max-height:150px; margin-top:8px; border-radius:6px;">
                    </div>
                    
                    <div class="form-group">
                        <label>Caption (Gemini จะสร้าง)</label>
                        <textarea id="desc-${idx}" placeholder="Gemini จะสร้างจากรูป...">${item.description}</textarea>
                    </div>
                    
                    <div class="buttons">
                        <button class="btn-ai" id="genBtn-${idx}" onclick="generateCaption(${idx})">🤖 Gemini Caption</button>
                        <button class="btn-copy" onclick="copyCaption(${idx})">📋 คัดลอก</button>
                    </div>
                    <div id="aiStatus-${idx}" style="font-size: 11px; color: #4285f4; margin-top: 8px; min-height: 16px;"></div>
                </div>
            `).join("");

            itemsData.forEach((item, idx) => {
                const textarea = document.getElementById(`desc-${idx}`);
                if (textarea) textarea.addEventListener('change', e => itemsData[idx].description = e.target.value);
                updateSellPrice(idx);
            });
        }

        function resetForm() {
            itemsData = [
                {name:"",category:"",productType:"clothing",categoryId:"",categoryName:"",price:"",originalPrice:"",description:"",imageUrl:"",variants:[],image:null},
                {name:"",category:"",productType:"clothing",categoryId:"",categoryName:"",price:"",originalPrice:"",description:"",imageUrl:"",variants:[],image:null},
                {name:"",category:"",productType:"clothing",categoryId:"",categoryName:"",price:"",originalPrice:"",description:"",imageUrl:"",variants:[],image:null}
            ];
            renderItems();
        }

        renderItems();
        updateApiStatus();
    </script>
</body>
</html>
